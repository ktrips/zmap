<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zmap デモ</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mute:#6b7785;--line:#dde3ea;--acc:#0b7a5c;--acc2:#e0f3ec;--warn:#c2410c;--sea:#dbeaf5;--land:#fff;--ring:#0b7a5c}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e6ecf2;--mute:#8d9aa8;--line:#2a3643;--acc:#3ecf9f;--acc2:#12352a;--warn:#fb923c;--sea:#16283a;--land:#223244;--ring:#3ecf9f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){button.primary{color:#06231a}}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.zip{font:700 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-align:center;padding:14px 8px 6px}
.zip small{display:block;font:12px system-ui;letter-spacing:0;color:var(--mute);margin-top:6px}
.steps{display:flex;gap:6px;justify-content:center;padding:4px 8px 12px}
.steps i{width:34px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}
#sv{display:block;width:100%;height:240px;background:#9cc}
#map{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;background:var(--sea)}
.info{padding:10px 12px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 16px}
.info b{color:var(--ink)}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--acc2);display:none}
.msg.show{display:block}
.note{margin-top:12px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>zmap <span class="badge">デモ(ダミーデータ)</span></h1>
  <div class="bar">
    <label>難易度
      <select id="diff">
        <option value="VE">VE(国)</option>
        <option value="Easy">Easy(県)</option>
        <option value="Mid" selected>Mid(市)</option>
        <option value="Diff">Difficult(町域)</option>
        <option value="VD">VD(完全な住所)</option>
      </select>
    </label>
    <span id="round" class="badge"></span>
    <span id="total" class="badge"></span>
  </div>
</header>

<div class="grid">
  <section class="card">
    <h2><span>ストリートビュー(模擬)</span><span id="fov"></span></h2>
    <svg id="sv" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="zip" id="zip"></div>
    <div class="steps" id="steps"></div>
    <div class="bar" style="justify-content:center;padding-bottom:12px">
      <button id="widen">ヒントを広げる(桁を1つ外す)</button>
      <button id="next" class="primary" style="display:none">次のラウンドへ</button>
    </div>
  </section>

  <section class="card">
    <h2><span>地図(タップでピンを立てて回答)</span><span id="area"></span></h2>
    <svg id="map" viewBox="0 0 400 480"></svg>
    <div class="info" id="hint"></div>
  </section>
</div>

<div class="msg" id="msg"></div>
<p class="note">デモ用の簡易地図・模擬ストリートビュー・固定の5地点です。本番は Google Maps Platform(Maps JavaScript / ストリートビュー / Geocoding / Places)を API キーで利用します。
ヒントは10秒ごとに自動で広がります。</p>
</div>

<script>
// ---- 固定のダミー問題(郵便番号, 地点, 住所) ----
const ROUNDS=[
 {zip:"060-0001",lon:141.354,lat:43.062,pref:"北海道",city:"札幌市中央区",town:"北一条西",addr:"北海道札幌市中央区北1条西2丁目",hue:210},
 {zip:"100-0005",lon:139.764,lat:35.681,pref:"東京都",city:"千代田区",town:"丸の内",addr:"東京都千代田区丸の内1丁目",hue:30},
 {zip:"920-0961",lon:136.656,lat:36.561,pref:"石川県",city:"金沢市",town:"香林坊",addr:"石川県金沢市香林坊1丁目",hue:160},
 {zip:"730-0011",lon:132.459,lat:34.395,pref:"広島県",city:"広島市中区",town:"基町",addr:"広島県広島市中区基町6丁目",hue:350},
 {zip:"810-0001",lon:130.402,lat:33.591,pref:"福岡県",city:"福岡市中央区",town:"天神",addr:"福岡県福岡市中央区天神2丁目",hue:270}
];
const RADIUS_KM=[0.6,2,8,30,110];         // 7桁→3桁で広がる範囲
const STAGE_BONUS=[1,.85,.7,.5,.3];
const DIFF={VE:{mult:1,tol:1500,label:"国"},Easy:{mult:2,tol:600,label:"県"},Mid:{mult:3,tol:200,label:"市"},Diff:{mult:4,tol:40,label:"町域"},VD:{mult:5,tol:5,label:"住所"}};
const LON0=128,LON1=146,LAT0=30,LAT1=46,W=400,H=480,KX=Math.cos(38*Math.PI/180);
const px=(lon,lat)=>[(lon-LON0)/(LON1-LON0)*W,(LAT1-lat)/(LAT1-LAT0)*H];
const kmPerPx=(111*(LAT1-LAT0))/H;
const ISLANDS=[
 [[130.9,34.0],[131.0,34.4],[132.5,35.4],[134.2,35.6],[135.7,35.7],[136.0,36.2],[136.7,37.3],[137.3,37.5],[138.5,37.4],[139.0,38.0],[139.8,39.5],[140.0,40.5],[140.3,41.2],[141.4,41.4],[141.5,40.0],[141.9,39.0],[141.0,38.2],[140.9,37.0],[140.6,36.2],[140.9,35.7],[140.3,35.2],[139.8,34.9],[139.2,35.2],[138.8,34.7],[137.3,34.6],[136.9,34.7],[136.3,34.2],[135.2,33.5],[135.1,34.3],[134.8,34.7],[133.0,34.4],[132.2,34.2]],
 [[140.0,41.6],[140.3,43.2],[141.4,43.2],[141.7,45.4],[142.9,44.3],[144.4,44.0],[145.5,43.4],[144.2,42.9],[143.3,42.0],[141.0,42.4]],
 [[129.8,33.2],[130.9,33.9],[131.8,33.3],[131.4,31.5],[130.7,31.2],[130.2,31.3],[130.2,32.6]],
 [[132.4,33.3],[132.7,34.1],[134.4,34.2],[134.6,33.7],[133.3,33.0]]
];

let r=0,stage=0,answered=false,total=0,timer=null,pin=null;
const $=id=>document.getElementById(id);
const svNS="http://www.w3.org/2000/svg";

function drawMap(){
  const m=$("map");
  let s=ISLANDS.map(p=>`<polygon points="${p.map(([a,b])=>px(a,b).join(",")).join(" ")}" fill="var(--land)" stroke="var(--mute)" stroke-width="1" opacity=".9"/>`).join("");
  const q=ROUNDS[r],[cx,cy]=px(q.lon,q.lat);
  const rad=Math.max(5,RADIUS_KM[stage]/kmPerPx);
  s+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="var(--ring)" fill-opacity=".22" stroke="var(--ring)" stroke-width="2"/>`;
  if(pin){const [a,b]=px(pin.lon,pin.lat);s+=`<circle cx="${a}" cy="${b}" r="6" fill="#e11d48" stroke="#fff" stroke-width="2"/>`;
    if(answered)s+=`<line x1="${a}" y1="${b}" x2="${cx}" y2="${cy}" stroke="#e11d48" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${cy}" r="5" fill="#16a34a" stroke="#fff" stroke-width="2"/>`;}
  m.innerHTML=s;
}
function drawSV(){
  const q=ROUNDS[r],h=q.hue;
  const zoom=[2.4,2.0,1.6,1.25,1.0][stage];
  const fovs=[30,45,60,85,110][stage];
  $("fov").textContent=`視野 ${fovs}°`;
  let b="";const bw=[70,90,60,100,80,75];let x=-20;
  for(let i=0;i<9;i++){const w=bw[i%6],hh=70+((i*37+h)%90);b+=`<rect x="${x}" y="${150-hh}" width="${w}" height="${hh+10}" fill="hsl(${(h+i*14)%360} 18% ${38+i%3*8}%)"/>`;
    for(let j=0;j<hh/18;j++)b+=`<rect x="${x+8}" y="${152-hh+j*18}" width="${w-16}" height="8" fill="hsl(${h} 30% 78%)" opacity=".55"/>`;x+=w-4;}
  $("sv").innerHTML=`<g transform="translate(200 150) scale(${zoom}) translate(-200 -150)">
   <rect width="400" height="240" y="-80" fill="hsl(${h} 55% 78%)"/>${b}
   <polygon points="-200,160 600,160 600,400 -200,400" fill="#555"/>
   <polygon points="160,160 240,160 330,260 70,260" fill="#666"/>
   <line x1="200" y1="165" x2="200" y2="260" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/></g>`;
}
function drawZip(){
  const z=ROUNDS[r].zip.replace("-","");const keep=7-stage;
  const d=(z.slice(0,keep)+"_".repeat(7-keep));
  $("zip").innerHTML=`${d.slice(0,3)}-${d.slice(3)}<small>${answered?"正解の郵便番号 "+ROUNDS[r].zip:"下の桁から外れていきます("+(7-stage)+"桁一致の範囲を表示中)"}</small>`;
  $("steps").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<=stage?"on":""}"></i>`).join("");
  $("area").textContent=`半径 約${RADIUS_KM[stage]}km`;
}
function render(){drawMap();drawSV();drawZip();$("round").textContent=`ラウンド ${r+1}/${ROUNDS.length}`;$("total").textContent=`合計 ${total}点`;}
function schedule(){clearInterval(timer);timer=setInterval(()=>{if(!answered)widen();},10000);}
function widen(){if(answered||stage>=4)return;stage++;render();hint();}
function hint(){const d=$("diff").value;$("hint").innerHTML=`<span>難易度 <b>${d}</b>(${DIFF[d].label}を当てる / ×${DIFF[d].mult})</span><span>段階ボーナス <b>×${STAGE_BONUS[stage]}</b></span>`;}
function dist(a,b,c,d){const dx=(c-a)*111*Math.cos((b+d)/2*Math.PI/180),dy=(d-b)*111;return Math.hypot(dx,dy);}

$("map").addEventListener("click",e=>{
  if(answered)return;
  const svg=$("map"),rect=svg.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;
  pin={lon:LON0+x/W*(LON1-LON0),lat:LAT1-y/H*(LAT1-LAT0)};
  answered=true;clearInterval(timer);
  const q=ROUNDS[r],d=$("diff").value,km=dist(pin.lon,pin.lat,q.lon,q.lat);
  const base=Math.max(0,Math.round(1000*Math.exp(-km/DIFF[d].tol)));
  const pts=Math.round(base*STAGE_BONUS[stage]*DIFF[d].mult/ (d==="VE"?1:1));
  total+=pts;
  let judge="";
  if(d==="VE")judge="国は日本です。正解!";
  else if(d==="VD")judge=km<DIFF.VD.tol?"住所まで一致!":`正解の住所: ${q.addr}(約${km.toFixed(1)}km 離れています)`;
  else judge=`正解は ${q.pref}${q.city}${d==="Diff"?" "+q.town:""}(約${km.toFixed(1)}km 離れています)`;
  $("msg").innerHTML=`<b>${pts}点</b> 獲得(距離スコア ${base} × 段階 ${STAGE_BONUS[stage]} × 難易度 ${DIFF[d].mult})<br>${judge}`;
  $("msg").classList.add("show");
  $("widen").disabled=true;$("next").style.display="";
  $("next").textContent=r===ROUNDS.length-1?"結果を見る":"次のラウンドへ";
  render();
});
$("widen").onclick=widen;
$("diff").onchange=hint;
$("next").onclick=()=>{
  if(r===ROUNDS.length-1){
    $("msg").innerHTML=`<b>ゲーム終了</b> 合計 ${total}点 / 難易度 ${$("diff").value}<br>共有文: 🟩🟩🟨⬜⬜ zmap ${total}点`;
    $("next").textContent="もう一度";$("next").onclick=()=>location.reload();return;}
  r++;stage=0;answered=false;pin=null;$("msg").classList.remove("show");$("widen").disabled=false;$("next").style.display="none";
  render();hint();schedule();
};
render();hint();schedule();
</script>
</body>
</html>
