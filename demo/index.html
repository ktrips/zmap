<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mapp — 地図と郵便番号当てゲーム</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mute:#6b7785;--line:#dde3ea;--acc:#0b7a5c;--acc2:#e0f3ec;--warn:#c2410c;--sea:#dbeaf5;--land:#fff;--ring:#0b7a5c}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e6ecf2;--mute:#8d9aa8;--line:#2a3643;--acc:#3ecf9f;--acc2:#12352a;--warn:#fb923c;--sea:#16283a;--land:#223244;--ring:#3ecf9f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:.04em;display:flex;align-items:center;flex-wrap:wrap}
h1 .logo{width:40px;height:40px;border-radius:10px;margin-right:10px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
h1 small{font-size:12px;font-weight:500;color:var(--mute);margin-left:10px;letter-spacing:0}
.gmenu{position:relative}
.gmenu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:168px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:4px;display:flex;flex-direction:column}
.gmenu-pop[hidden]{display:none}
.gmenu-pop button{text-align:left;border:none;background:transparent;border-radius:8px}
.gmenu-pop button.on{background:var(--acc2);color:var(--acc);font-weight:700}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.badge:empty{display:none}
#total{font-size:22px;font-weight:900;color:var(--warn);border-color:var(--warn);padding:2px 14px}#total.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.3)}}
.hist{margin:12px auto 0;border-collapse:collapse;font-size:13px;min-width:260px}.hist th,.hist td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left}.hist td.p{text-align:right;font-weight:700}.hist tr.now td{background:rgba(245,158,11,.18)}.hist caption{font-weight:700;margin-bottom:4px}
a.badge{color:var(--acc);text-decoration:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){button.primary{color:#06231a}}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.zip{font:700 30px/1 ui-monospace,Menlo,monospace;letter-spacing:0;text-align:center;padding:2px 8px 8px;display:flex;flex-direction:column;align-items:center}
.zip small{display:block;font:12px system-ui;letter-spacing:0;color:var(--mute);margin-top:8px;max-width:100%}
.zboard{display:inline-flex;align-items:flex-start;justify-content:center}
.zcol{width:40px;display:flex;flex-direction:column;align-items:center}
.zcol.hy{width:14px}
.zd{display:block;font:700 32px/1 ui-monospace,Menlo,monospace;height:34px}
.zcol.off .zd{opacity:.35}
.zmark{display:block;margin-top:2px;padding:0;border:0;background:transparent;color:var(--mute);font:700 10px/1.15 system-ui;width:100%;cursor:default}
.zmark b{display:block;font-size:12px;white-space:nowrap}
.zmark small{display:none}
.zmark.now{color:var(--warn)}
.zmark.now b{font-size:14px}
.zmark.past{opacity:.35;text-decoration:line-through}
.zmark.next{cursor:pointer;color:var(--acc);background:var(--acc2);border:2px solid var(--acc);border-radius:8px;padding:3px 0 2px;margin-top:4px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.zmark.next b{font-size:15px}
.zmark.next small{font-size:11px}
.zmark:disabled{opacity:1}
/* 郵便番号の桁: 桁と点数を大きく。今の段階の桁を枠で囲んで、点数は塗りつぶす */
.zcol{width:50px}
.zcol.hy{width:16px}
.zd{font:800 44px/1 ui-monospace,Menlo,monospace;height:50px;border-radius:10px}
.zcol.cur .zd{background:var(--acc2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--acc)}
.zmark{margin-top:6px}
.zmark b{font-size:19px;font-weight:900}
.zmark.now{color:#fff;background:var(--warn);border-radius:8px;padding:4px 0 3px}
.zmark.now b{font-size:20px;color:#fff}
.zmark.next b{font-size:19px}
.steps{display:none}
.steps i{width:34px;height:6px;border-radius:3px;background:var(--line)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}.ans label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}.ans select,.ans input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}.ans .full{grid-column:1/-1}.ans button{grid-column:1/-1}
#next{display:none;width:calc(100% - 24px);margin:0 12px 12px;padding:14px 16px;font-size:18px;font-weight:800}
.local{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.7);color:#1f2937;font-size:14px;line-height:1.6;text-align:left}.local b{color:#0b7a5c}.local .wiki:empty{display:none}.local .wiki{margin-top:4px;font-size:13px}
.ans .country{grid-column:1/-1;font-size:13px;color:var(--mute)}.ans .country b{color:var(--ink)}
.result{display:none;margin:0 12px 12px;padding:14px;border-radius:12px;text-align:center;position:relative;overflow:hidden}
.result.show{display:block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.result.win{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#4a2c00}
.result.lose{background:#e2e8f0;color:#334155}
.result.warn{background:#fee2e2;color:#7f1d1d;font-size:14px;padding:8px}
.result.final{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#053b2a}
.result .big{font-size:30px;font-weight:800;line-height:1.2}
.result .pts{font-size:46px;font-weight:900;line-height:1.1;margin:4px 0}
.result .sub{font-size:13px;opacity:.85}
.result .answer{font-size:24px;font-weight:900;line-height:1.3;margin:6px 0 8px}
.reveal{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--acc2)}
.reveal.show{display:block;animation:pop .4s ease-out}
.reveal small{display:block;font-size:12px;color:var(--mute)}
.reveal b{display:block;font-size:30px;line-height:1.25;font-weight:900}
.reveal span{font:600 14px ui-monospace,Menlo,monospace;color:var(--mute)}
@media(max-width:720px){.reveal b{font-size:23px}.result .answer{font-size:20px}}
.result .conf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(240px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.result.show,.result .conf{animation:none}}
.bonus{margin:-4px 12px 10px;text-align:center}
.potential{font-size:15px;color:var(--mute)}.potential b{font-size:30px;color:var(--warn);font-weight:900}
.ladder{display:none}
#widen{display:block;margin:10px auto 0;font-weight:800;letter-spacing:.04em}
.rung.next{cursor:pointer}.rung.next:hover{border-color:var(--acc)}
.rung{flex:1;max-width:76px;border:2px solid var(--line);border-radius:10px;padding:3px 0;text-align:center;line-height:1.15;transition:.25s}
.rung span{display:block;font-weight:800;font-size:16px}.rung small{font-size:11px;color:var(--mute)}
.rung.now{border-color:var(--warn);background:var(--warn);color:#fff;transform:scale(1.12)}.rung.now small{color:#fff}
.rung.past{opacity:.35;text-decoration:line-through}
.cd{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
#cdbar{height:100%;width:100%;background:var(--acc);border-radius:5px}
#cdbar.low{background:#dc2626}
.cdtxt{font-size:13px;color:var(--mute);margin-top:4px}.cdtxt b{font-size:18px;color:var(--ink)}
.steps i.on{background:var(--acc)}
#sv{display:block;width:100%;height:240px;background:#9cc}
#gsv{display:none;width:100%;height:380px}
#gmap{display:none;width:100%;height:clamp(600px,82dvh,920px)}
@media(max-width:720px){#gsv{height:300px}}
.gm #gsv,.gm #gmap{display:block}.gm #sv,.gm #map{display:none}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.cloud{animation:drift 40s linear infinite}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}
#map{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;background:var(--sea)}
.info{padding:10px 12px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 16px}
.info b{color:var(--ink)}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--acc2);display:none}
.msg.show{display:block}
.note{margin-top:12px;font-size:12px;color:var(--mute)}

#intro{position:fixed;inset:0;z-index:10;background:#0a1220;display:block}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:11;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
#brand{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top));z-index:12;display:flex;align-items:center;gap:12px;color:#fff;text-shadow:0 2px 12px #000}
#brand img{width:45px;height:45px;border-radius:11px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#brand .nm{display:flex;align-items:center;gap:10px}
#brand b{display:block;font:800 30px/1.05 system-ui;letter-spacing:.12em;color:#3ecf9f}
#brand small{display:block;font:14px/1.3 system-ui;opacity:.9;margin-top:4px;letter-spacing:.04em}
#flags{display:flex;gap:6px}
#flags button{font-size:17px;line-height:1;padding:3px 5px;border-radius:8px;background:rgba(255,255,255,.1);border:1.5px solid transparent;opacity:.65;cursor:pointer}
#flags button.on{opacity:1;border-color:#3ecf9f;background:rgba(62,207,159,.18)}
/* 案内 → 選択 → 説明を、ブランドの下に縦に並べる(地球儀はこの下に描く) */
#top{position:absolute;left:0;right:0;top:calc(92px + env(safe-area-inset-top));z-index:11;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;color:#fff;text-align:center;text-shadow:0 2px 12px #000}
#title{font:600 15px/1.4 system-ui;letter-spacing:.04em;min-height:1.4em}
#title small{display:none}
#ctrl{display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;align-items:center;text-shadow:none}
#ctrl select{background:#fff;color:#111;font-size:16px;padding:10px 12px}
#ctrl button{font-size:18px;padding:10px 24px}
#modedesc{font:13px/1.5 system-ui;opacity:.9;max-width:34em}
#pxlab{display:none;align-items:center;gap:8px;color:#fff;font-size:14px;flex-wrap:wrap;justify-content:center}
#pxtxt{font-size:18px;font-weight:800}
#pxlab input{width:3.4em;font-size:17px;padding:6px;text-align:center;letter-spacing:.2em;color:#111;background:#fff;border-radius:8px;border:none}
#pxhint{display:block;max-width:320px;margin:0 auto;font-size:12px;line-height:1.3;opacity:.9;text-align:center}
#pxhint:empty{display:none}
@media(max-width:720px){
  /* ノッチ・ダイナミックアイランドに隠れないよう、上は安全領域ぶん空ける */
  .wrap{padding:calc(env(safe-area-inset-top) + 6px) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  header{flex-wrap:nowrap;gap:4px;margin-bottom:6px;align-items:center}
  h1{flex:0 0 auto;font-size:0;line-height:0}
  h1 .brand,h1 small{display:none}
  h1 .logo{width:28px;height:28px;margin:0;border-radius:7px}
  .bar{flex:1 1 auto;flex-wrap:nowrap;gap:4px;justify-content:flex-end;min-width:0}
  .bar .badge,.bar button,#replay{font-size:12.5px;padding:4px 8px;line-height:1.35;white-space:nowrap}
  #total{font-size:13.5px;padding:3px 8px}
  .desk{display:none!important}
  .grid{position:relative;display:flex;flex-direction:column}
  #mapcard{order:-1}
  #playcard{overflow:visible}
  #playcard > h2,#mapcard > h2{display:none}
  /* 1画面に 地図 + ヒントを広げる + 郵便番号 + 回答欄。説明文はその下 */
  #map,#gmap{height:clamp(300px,calc(100dvh - 300px),70dvh)}
  #sv,#gsv{position:absolute;top:8px;right:8px;width:40%;height:min(138px,37%);z-index:6;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4);border:2px solid #fff;background:#123}
  .gm #gsv{display:block;width:40%;height:min(138px,37%)}
  /* 拡大縮小ボタンは小さくして、画像を広く見せる */
  #gsv .gmnoprint,#gsv .gm-bundled-control{transform:scale(.6);transform-origin:right bottom}
  #mapcard{position:relative}
  #hint{font-size:12px;padding:8px 10px 4px}
  #widen{margin:6px auto 0;padding:4px 14px;font-size:13px}
  .zip{padding:4px 4px 2px}
  .zip small{margin-top:2px;font-size:11px}
  .zcol{width:42px}
  .zcol.hy{width:12px}
  .zd{font-size:36px;height:42px}
  .zmark b{font-size:15px}
  .zmark.now b{font-size:16px}
  .zmark.next b{font-size:15px}
  .bonus{margin:0 10px 4px}
  .potential{display:none}
  .cdtxt{margin-top:2px;font-size:11px}
  .cd{height:6px}
  .ans{gap:6px;padding:0 10px 8px}
  .ans .country{display:none}
  .ans select,.ans input{padding:6px 8px}
  .ans label{gap:1px}
  .result{margin:0 10px 8px}
  .gmenu-pop button{font-size:14px;padding:8px 10px;white-space:normal}
  #top{padding:0 8px}
  #ctrl{gap:6px}
  #ctrl select{font-size:14px;padding:8px 6px;max-width:170px}
  #ctrl button{font-size:16px;padding:9px 12px;white-space:nowrap}
  #pxlab{gap:4px;flex-wrap:nowrap}
  #pxtxt{font-size:16px}
  #pxlab input{width:3.2em;font-size:16px;padding:6px 4px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><img class="logo" src="favicon.svg" alt="" width="40" height="40"><span class="brand">Mapp</span><small id="subtitle">都道府県当て</small></h1>
  <div class="bar">
    <div class="gmenu">
      <button id="menubtn" class="badge" type="button" aria-expanded="false" aria-haspopup="true">都道府県 ▾</button>
      <div id="gmenu" class="gmenu-pop" hidden></div>
    </div>
    <span id="dbadge" class="badge desk"></span>
    <span id="keybadge" class="badge desk"></span>
    <button id="replay"></button>
    <span id="round" class="badge"></span>
    <span id="total" class="badge"></span>
  </div>
</header>

<div class="grid">
  <section class="card" id="playcard">
    <h2><span id="svtitle"></span><span id="fov"></span></h2>
    <svg id="sv" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"></svg><div id="gsv"></div>
    <button id="widen" type="button"></button>
    <div class="zip" id="zip"></div>
    <div class="steps" id="steps"></div>
    <div id="bonus" class="bonus"><div id="potential" class="potential"></div><div class="cd"><div id="cdbar"></div></div><div id="cdtxt" class="cdtxt"></div></div>
    <div id="ans" class="ans"></div>
    <button id="next" class="primary" type="button"></button>
    <div id="result" class="result"></div>
    <div class="info" id="pinst" style="display:none"></div>
    <div class="info" id="hint"></div>
  </section>

  <section class="card" id="mapcard">
    <h2><span id="maptitle"></span><span id="area"></span></h2>
    <div id="reveal" class="reveal"></div>
    <svg id="map" viewBox="0 0 400 480"></svg><div id="gmap"></div>
  </section>
</div>

<div class="msg" id="msg"></div>
<p class="note" id="note"></p>
</div>

<div id="intro"><canvas id="ic"></canvas><div id="brand"><img src="favicon.svg" alt="" width="45" height="45"><div><div class="nm"><b id="brandname">Mapp</b><span id="flags"><button type="button" data-lang="ja" aria-label="日本語">🇯🇵</button><button type="button" data-lang="en" aria-label="English">🇺🇸</button></span></div><small id="tagline"></small></div></div><div id="top"><div id="title"></div><div id="ctrl"><select id="imode"></select><label id="pxlab"><span id="pxtxt"></span><input id="ipx" inputmode="numeric" maxlength="3" autocomplete="off"></label><button id="throw" class="primary" type="button"></button></div><span id="pxhint"></span><div id="modedesc"></div></div><button id="skip" type="button"></button></div>
<script src="config.js"></script>
<script src="map-style.js"></script>
<script src="native.js"></script>
<script src="meibutsu.js"></script>
<script>
// ---- Google Maps API キー(config.js 由来。未設定ならダミーデータのデモ) ----
// ラベル非表示スタイルは map-style.js(ZMAP_MAP_STYLE.hideLabels)
const MAPS_KEY=(window.ZMAP_CONFIG&&window.ZMAP_CONFIG.googleMapsApiKey)||"";
// loading=async では script の onload 時点でまだ Geocoder などが使えないため、callback を待つ
let mapsReady=null;
function loadGoogleMaps(){
  if(!mapsReady)mapsReady=new Promise((ok,ng)=>{
    window.__zmapMapsReady=()=>ok(window.google.maps);
    const sc=document.createElement("script");sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAPS_KEY)}&loading=async&libraries=places,geocoding&language=${LANG==="en"?"en":"ja"}&region=${LANG==="en"?"US":"JP"}&callback=__zmapMapsReady`;
    sc.onerror=()=>{mapsReady=null;ng(new Error("Google Maps の読み込みに失敗"));};document.head.appendChild(sc);});
  return mapsReady;
}
// ---- Google Map 生成(答えのヒントになる地名・道路名・施設名などのラベルを必ず非表示にする) ----
// スタイル定義は map-style.js(ZMAP_MAP_STYLE)。Map は必ずこの関数で生成する。
// 見た目確認: localhost でだけ ?mapstyle=off でスタイル無効(ラベル表示の衛星+地図)にして比較できる。本番では答えが見えてしまうので無効。
async function createGoogleMap(el,opts){
  const maps=await loadGoogleMaps();
  const off=labelsAlways=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).get("mapstyle")==="off";
  return new maps.Map(el,{
    // 回答前は自分で拡大縮小・移動できない(広げると答えが分かるため)。gSetView が回答後に解除する
    clickableIcons:false,gestureHandling:"none",zoomControl:false,disableDoubleClickZoom:true,keyboardShortcuts:false,
    // styles は衛星/ハイブリッド画像には効かないため、ラベル非表示時は通常地図(roadmap)を使う
    ...(off?{mapTypeId:"hybrid",mapTypeControl:true}:{mapTypeId:"roadmap",mapTypeControl:false,styles:window.ZMAP_MAP_STYLE.hideLabels}),
    ...opts
  });
}
// ---- Google Maps 実地図モード(キーがあり読み込めた場合のみ。失敗時は下のダミー表示にフォールバック) ----
let labelsAlways=false,gMode=false,gmap=null,gpano=null,gcircle=null,gpin=null,gtruth=null,gline=null,gRegions=[];
const G_ZOOM=[16,14,12,10,7],G_SVZ=[1.7,1.2,0.7,0.3,0];   // ストリートビューの拡大率(視野 約55°→180°)
async function initGoogle(){
  if(!MAPS_KEY)return;
  try{
    const gm=await loadGoogleMaps();
    const home=isUS()?{lat:39.8,lng:-98.5}: {lat:36.2,lng:138.2};
    gmap=await createGoogleMap($("gmap"),{center:home,zoom:isUS()?4:5,streetViewControl:false,fullscreenControl:false,rotateControl:false,keyboardShortcuts:false});
    gmap.addListener("click",e=>{if(answered)return;pin={lon:e.latLng.lng(),lat:e.latLng.lat()};zmapNative.haptic("light");gDrawMap();pinPlaced();});

    ctx.fillStyle="#d4a017";for(const s of [-1,1]){ctx.beginPath();ctx.arc(cx,cy+s*R*1.08,R*.035,0,7);ctx.fill();}
    // 人物(頭を大きめにした、ちょっとリアルなデフォルメ)
    const u=Math.min(w,h)/540,px0=w*0.2,bob=tau<0?Math.sin(t*3)*1.5*u:0,py0=Math.min(h-10*u,Math.max(h*0.8,topZone+185*u));
    const leanAt=x=>x<0?0:Math.min(1,x/0.3)*0.08,lean=leanAt(tau),du=0.55*u,HOLD_A=-0.3;   // ダーツは頭の幅の半分くらいの大きさ
    // 投げる腕: 肘を前に上げて構え、前腕だけを振り出す(ダーツの投げ方)。k=振り出し 0→1、f=フォロースルー 0→1

    ctx.fillStyle="#334155";rr(px0-19*u,py0-64*u+bob,16*u,60*u,7*u);ctx.fill();rr(px0+3*u,py0-64*u+bob,16*u,60*u,7*u);ctx.fill(); // 脚

    ctx.fillStyle="#dc2626";ctx.beginPath();ctx.arc(px0,py0-178*u+bob,28*u,Math.PI*1.02,Math.PI*1.98);ctx.closePath();ctx.fill(); // 帽子

    if(!blink){ctx.fillStyle="#fff";for(const ex of [7.2,19.2]){ctx.beginPath();ctx.arc(px0+ex*u,py0-168*u+bob,1.3*u,0,7);ctx.fill();}}
    ctx.fillStyle="rgba(244,114,182,.45)";for(const ex of [0,24]){ctx.beginPath();ctx.ellipse(px0+ex*u,py0-156*u+bob,5*u,3*u,0,0,7);ctx.fill();} // ほっぺ
    ctx.strokeStyle="#9a3412";ctx.lineWidth=2*u;ctx.beginPath();ctx.arc(px0+13*u,py0-155*u+bob,5*u,0.2*Math.PI,0.8*Math.PI);ctx.stroke(); // 口
    // 投げる腕(顔の横で構えるので頭より手前に描く): 袖 → 袖口 → 前腕 → ダーツ → 手

    ctx.strokeStyle="#38bdf8";ctx.lineWidth=3.5*u;ctx.lineCap="butt";ctx.beginPath();ctx.moveTo(cuff[0]+sn*7.5*u,cuff[1]-cs*7.5*u);ctx.lineTo(cuff[0]-sn*7.5*u,cuff[1]+cs*7.5*u);ctx.stroke();ctx.lineCap="round";

function offlineRounds(){
  if(mode==="state")return shuffled(US_PLACES,roundRandom()).slice(0,5).map(q=>({...q}));
  if(isZipMode()){
    const got=(isUS()?US_PLACES:OFFLINE).filter(q=>String(q.zip).replace(/\D/g,"").startsWith(prefix));
    if(!got.length)throw new Error(t("noPractice"));
    return shuffled(got,roundRandom()).slice(0,5).map(q=>({...q}));
  }
  return (DAILY?shuffled(DUMMY_ROUNDS,roundRandom()):DUMMY_ROUNDS.slice()).map(q=>({...q}));
}
async function prepareRounds(){
  applyFrame();
  const country=isUS()?"US":"JP";
  if(isZipMode()){
    if(!MAPS_KEY){ROUNDS=offlineRounds();$("keybadge").textContent=t("practiceZip");}
    else{
      try{ROUNDS=await loadExpertRounds(5);$("keybadge").textContent="";}
      catch(e){console.warn(e);ROUNDS=offlineRounds();$("keybadge").textContent=t("practiceZip2");}
    }
  }else if(!MAPS_KEY){
    ROUNDS=offlineRounds();$("keybadge").textContent=t("practice5");
  }else{
    try{ROUNDS=await loadRandomRounds(5,country);$("keybadge").textContent="";}
    catch(e){console.warn(e);
      try{ROUNDS=await loadRoundsFromGeocoding(5,country);$("keybadge").textContent="";}
      catch(e2){console.warn(e2);ROUNDS=offlineRounds();$("keybadge").textContent=t("practiceFail");}}
  }
  if(!ROUNDS.length)throw new Error(t("noRounds"));
  loadedMode=mode;loadedPrefix=prefix;
  r=0;stage=0;answered=false;pin=null;
}
async function boot(){
  applyLang();syncChrome();applyFrame();
  if(!isZipMode()){
    $("ctrl").style.display="none";
    $("title").textContent=t("finding");
    try{await prepareRounds();}
    catch(e){console.warn(e);try{ROUNDS=offlineRounds();}catch(e2){ROUNDS=(isUS()?US_PLACES:DUMMY_ROUNDS).slice();}loadedMode=mode;}
  }else if($("keybadge"))$("keybadge").textContent=MAPS_KEY?"":t("enterPrefix");
  vb=vbFor(0);render();hint();startIntro(()=>{hint();schedule();});
  initGoogle().then(()=>{if(!gMode)return;if(isZipMode()&&prefix)fitRegion();else setVB(vbFor(stage),true);});
}
$("menubtn").onclick=e=>{e.stopPropagation();const p=$("gmenu");p.hidden=!p.hidden;$("menubtn").setAttribute("aria-expanded",String(!p.hidden));};
$("gmenu").onclick=e=>{const b=e.target.closest("button[data-go]");if(b)goGame(b.dataset.go);};
addEventListener("click",e=>{if(!e.target.closest(".gmenu"))$("gmenu").hidden=true;});
boot();
$("replay").onclick=()=>{location.reload();};
