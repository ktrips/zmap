name: ios-build
# zmap の iOS アプリ(ios/)がビルドできるかを確認する。署名なしのシミュレータ向けビルド。
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27   # Xcode 27(iOS 27 SDK)入りのイメージ
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27 を選ぶ
        run: |
          x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::Xcode 27 がランナーにありません"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$x"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: brew install xcodegen
      - run: cd ios && DEVELOPMENT_TEAM= xcodegen
      - run: |
          cd ios
          xcodebuild -project Zmap.xcodeproj -scheme Zmap -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
