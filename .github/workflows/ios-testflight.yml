name: ios-testflight
# zmap の iOS アプリ(ios/)を署名して TestFlight にアップロードする。手動実行(Actions → ios-testflight → Run workflow)。
# 署名は App Store Connect の API キーによる自動署名(証明書とプロビジョニングは Apple 側で自動作成)。
# 必要な Secrets / Variables は README の「TestFlight に配信する」を参照。
on:
  workflow_dispatch:
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  beta:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Variable に登録するのが基本。Secret に入れた場合も使えるようにしておく
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM || secrets.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - name: 必要な設定がそろっているか確認
        run: |
          missing=""
          [ -z "$DEVELOPMENT_TEAM" ] && missing="$missing DEVELOPMENT_TEAM(Variable)"
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID(Secret)"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID(Secret)"
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8(Secret)"
          if [ -n "$missing" ]; then echo "::error::未設定です:$missing(Settings → Secrets and variables → Actions)"; exit 1; fi
      - name: App Store Connect API キーを置く
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Xcode 26 以降を選ぶ(App Store Connect は iOS 26 SDK 以降でのビルドが必須)
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::Xcode 26 がランナーにありません"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$x"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Xcode プロジェクトを生成
        run: cd ios && xcodegen
      - name: Archive
        run: |
          set -o pipefail
          cd ios
          # 失敗したとき原因が埋もれないよう、ログを残して error 行だけを最後にまとめて出す
          trap 'echo "::group::error lines"; grep -nE "error:|Error Domain|requires a development team|No profiles|provisioning" "$RUNNER_TEMP/archive.log" | head -40; echo "::endgroup::"' ERR
          xcodebuild archive \
            -project Zmap.xcodeproj -scheme Zmap -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Zmap.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"
      # API キーにクラウド署名の権限がないチームでは自動署名の書き出しが失敗するので、
      # 配布用証明書(p12)と App Store プロファイルが Secrets にあればそれで手動署名する
      - name: 配布用証明書とプロファイルを入れる
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          [ -n "$DIST_CERT_P12" ] && [ -n "$APPSTORE_PROFILE" ] || { echo "手動署名の Secrets がないので自動署名で書き出します"; exit 0; }
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract UUID raw -)
          name=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract Name raw -)
          for d in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/appstore.mobileprovision" "$d/$uuid.mobileprovision"
          done
          echo "MANUAL_PROFILE=$name" >> "$GITHUB_ENV"
      - name: ipa を作る
        run: |
          if [ -n "$MANUAL_PROFILE" ]; then
            signing="<key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>net.ktrips.zmap</key><string>${MANUAL_PROFILE}</string></dict>"
          else
            signing="<key>signingStyle</key><string>automatic</string>"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            ${signing}
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Zmap.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: TestFlight にアップロード
        run: |
          xcrun altool --upload-app --type ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
